<!doctype html>
<html lang="fa" dir="rtl">
<head>
<script src="https://tapi.bale.ai/miniapp.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>حضور و غیاب قرارگاه (آزمایشی)</title>
<style>
  @font-face { font-family: "Vazirmatn"; font-display: swap;
    src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2") format("woff2"); }
  :root { --bg:#f4f6f8; --card:#fff; --tx:#1d2a33; --mut:#6b7a86; --pri:#0f766e; --bd:#dde3e8;
          --pres:#15803d; --leave:#b45309; --abs:#b91c1c; --guest:#6d28d9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.7 "B Nazanin","Vazirmatn",Tahoma,sans-serif; }
  header { background:var(--pri); color:#fff; padding:12px 16px; font-weight:700; font-size:17px; }
  header small { display:block; font-weight:400; opacity:.85; font-size:12px; }
  main { padding:12px 12px 90px; max-width:720px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:15px; }
  label { display:block; font-size:13px; color:var(--mut); margin-top:6px; }
  input, select { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff; color:var(--tx); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .seg { display:flex; gap:6px; margin-top:4px; } .seg button { flex:1; }
  button { font:inherit; border:1px solid var(--bd); background:#fff; border-radius:8px; padding:8px; cursor:pointer; color:var(--tx); }
  button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .btn { background:var(--pri); color:#fff; border:none; font-weight:700; padding:11px; width:100%; margin-top:8px; }
  .btn.sec { background:#fff; color:var(--pri); border:1px solid var(--pri); }
  .person { border-top:1px solid var(--bd); padding:8px 0; }
  .person:first-child { border-top:none; }
  .pname { font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .tag { font-size:11px; padding:0 8px; border-radius:10px; background:#eef2f5; color:var(--mut); font-weight:400; }
  .st { display:flex; gap:4px; margin-top:4px; } .st button { flex:1; padding:5px; font-size:13px; }
  .st button.pres.on { background:var(--pres); border-color:var(--pres); }
  .st button.leave.on { background:var(--leave); border-color:var(--leave); }
  .st button.abs.on { background:var(--abs); border-color:var(--abs); }
  .times { display:flex; gap:6px; margin-top:4px; } .times input { padding:4px 6px; }
  .hidden { display:none !important; }
  #shots img { width:100%; border:1px solid var(--bd); border-radius:6px; margin-top:8px; }
  #log { font-size:12px; white-space:pre-wrap; background:#0b1720; color:#cde; border-radius:8px; padding:8px; direction:ltr; text-align:left; max-height:220px; overflow:auto; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--bd); padding:8px 12px; display:flex; gap:8px; }
  .bar button { flex:1; margin:0; }
  .counts { font-size:13px; color:var(--mut); }
  #lock { position:fixed; inset:0; background:var(--bg); z-index:9; display:flex; align-items:center; justify-content:center; padding:24px; }
  #lock .card { width:100%; max-width:360px; text-align:center; }
  #lockErr { color:var(--abs); font-size:13px; min-height:20px; }
</style>
</head>
<body>
<div id="lock" class="hidden"><div class="card"><h3>🔒 حضور و غیاب قرارگاه</h3><p class="counts">رمز مینی‌اپ را وارد کنید (فقط بار اول)</p><input id="lockPw" type="password" autocomplete="current-password" dir="ltr" placeholder="رمز"><button class="btn" id="lockBtn">ورود</button><div id="lockErr"></div></div></div>
<header>حضور و غیاب قرارگاه — نسخه آزمایشی<small>واحد سرمایه انسانی</small></header>
<main>
  <div class="card">
    <h3>۱. مشخصات برنامه</h3>
    <label>نام برنامه</label><input id="pName" value="جلسه آزمایشی">
    <div class="row">
      <div><label>واحد</label><select id="pUnit"></select></div>
      <div><label>تاریخ</label><input id="pDate" value="۱۴۰۵/۰۸/۲۶"></div>
    </div>
    <div class="row">
      <div><label>ساعت شروع</label><input id="pStart" type="time" value="20:00"></div>
      <div><label>ساعت پایان</label><input id="pEnd" type="time" value="22:00"></div>
    </div>
    <label>نوع برنامه</label>
    <div class="seg" id="pType"><button data-v="m" class="on">اجباری</button><button data-v="o">اختیاری</button></div>
    <label>حلقه</label>
    <select id="pCircle"></select>
  </div>

  <div class="card">
    <h3>۲. حضور و غیاب <span class="counts" id="counts"></span></h3>
    <input id="search" placeholder="🔍 جست‌وجوی اسم…">
    <div id="people"></div>
    <div class="row" style="margin-top:8px">
      <input id="guestName" placeholder="نام مهمان">
      <button id="addGuest" style="flex:0 0 90px">➕ مهمان</button>
    </div>
  </div>

  <div class="card">
    <h3>۳. خروجی (آزمایش روش‌های ارسال)</h3>
    <div id="shots"></div>
    <button class="btn sec" id="tDownload">۱) ذخیره عکس روی گوشی</button>
    <button class="btn sec" id="tShare">۲) اشتراک‌گذاری عکس (ارسال در بله)</button>
    <button class="btn sec" id="tCopy">۳) کپی متن CSV</button>
    <button class="btn sec" id="tCsv">۴) ذخیره فایل CSV</button>
    <button class="btn sec" id="tSend">۵) ارسال مستقیم به ربات (sendData)</button>
    <button class="btn" id="tBrowser">۶) باز کردن در مرورگر گوشی و ذخیره عکس</button>
    <button class="btn" id="tShareAll">۷) ارسال عکس + فایل CSV در چت بله (در Chrome)</button>
    <p class="counts">بعد از امتحان هر دکمه، نتیجه را در کادر زیر می‌بینید. لطفاً از این کادر عکس بگیرید و بفرستید.</p>
    <div id="log"></div>
  </div>
</main>
<div class="bar">
  <button class="btn sec" id="saveDraft">💾 ذخیره اطلاعات</button>
  <button class="btn" id="final">✔️ ثبت نهایی و ساخت عکس</button>
</div>

<script>
(() => {   // own scope: the Bale SDK defines globals (e.g. W)
"use strict";
// ---------- data: decrypted from members.enc after the password ----------
let CIRCLES = [], MEMBERS = [], PASS = "";

const STATUS = { pres: "حاضر", leave: "مرخصی", abs: "غایب" };
const $ = (id) => document.getElementById(id);
const W = window.Bale && window.Bale.WebApp;
let state = { type: "m", circle: -1, people: {}, guests: [] };
let pngs = [];   // generated page blobs

function fa(x) { return String(x).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]); }
function log(s) { $("log").textContent += s + "\n"; $("log").scrollTop = 1e9; }

// ---------- diagnostics ----------
(function diag() {
  log("Bale.WebApp: " + (W ? "yes, v" + W.version + (W.isIframe ? " (web)" : " (app)") : "NO (opened outside Bale)"));
  log("navigator.share: " + !!navigator.share + " | canShare: " + !!navigator.canShare);
  log("clipboard: " + !!(navigator.clipboard && navigator.clipboard.writeText));
  log("UA: " + navigator.userAgent.slice(0, 110));
  if (W) { try { W.ready(); W.expand(); } catch (e) { log("ready/expand: " + e); } }
})();

// ---------- form ----------
function fillLists(units) {
  CIRCLES.forEach((c, i) => $("pCircle").add(new Option(c, i)));
  $("pCircle").add(new Option("همه حلقه‌ها", -1));
  $("pCircle").value = -1;
  units.forEach((u) => $("pUnit").add(new Option(u, u)));
}
$("pType").onclick = (e) => {
  if (!e.target.dataset.v) return;
  state.type = e.target.dataset.v;
  [...$("pType").children].forEach((b) => b.classList.toggle("on", b === e.target));
  render();
};
$("pCircle").onchange = () => { state.circle = +$("pCircle").value; render(); };
$("search").oninput = render;

function person(name) {
  if (!state.people[name]) state.people[name] = { st: state.type === "m" ? "abs" : "", tin: "", tout: "" };
  return state.people[name];
}
function visibleMembers() {
  const q = $("search").value.trim();
  return MEMBERS.filter(([n, c]) => (state.circle < 0 || c === state.circle) && (!q || n.includes(q)));
}
function render() {
  const box = $("people"); box.innerHTML = "";
  visibleMembers().forEach(([n, c, kind]) => {
    const p = person(n);
    const d = document.createElement("div"); d.className = "person";
    d.innerHTML = `<div class="pname">${n}<span class="tag">${CIRCLES[c].replace("حلقه ", "")} · ${kind}</span></div>
      <div class="st">${Object.entries(STATUS).filter(([k]) => state.type === "m" || k === "pres")
        .map(([k, t]) => `<button class="${k}${p.st === k ? " on" : ""}" data-k="${k}">${t}</button>`).join("")}</div>
      <div class="times ${p.st === "pres" ? "" : "hidden"}"><input type="time" value="${p.tin || $("pStart").value}" data-t="tin">
      <input type="time" value="${p.tout || $("pEnd").value}" data-t="tout"></div>`;
    d.querySelector(".st").onclick = (e) => {
      const k = e.target.dataset.k; if (!k) return;
      p.st = (state.type === "o" && p.st === k) ? "" : k; render();
    };
    d.querySelectorAll("input").forEach((inp) => inp.onchange = () => { p[inp.dataset.t] = inp.value; });
    box.appendChild(d);
  });
  state.guests.forEach((g, i) => {
    const d = document.createElement("div"); d.className = "person";
    d.innerHTML = `<div class="pname">${g.name}<span class="tag" style="color:var(--guest)">مهمان ✖</span></div>
      <div class="times"><input type="time" value="${g.tin}"><input type="time" value="${g.tout}"></div>`;
    d.querySelector(".tag").onclick = () => { state.guests.splice(i, 1); render(); };
    const [a, b] = d.querySelectorAll("input"); a.onchange = () => g.tin = a.value; b.onchange = () => g.tout = b.value;
    box.appendChild(d);
  });
  const c = counts();
  $("counts").textContent = `(حاضر ${fa(c.pres)} · مرخصی ${fa(c.leave)} · غایب ${fa(c.abs)} · مهمان ${fa(state.guests.length)})`;
}
function counts() {
  const c = { pres: 0, leave: 0, abs: 0 };
  rowsForOutput().forEach((r) => { if (c[r.st] !== undefined) c[r.st]++; });
  return c;
}
$("addGuest").onclick = () => {
  const n = $("guestName").value.trim(); if (!n) return;
  state.guests.push({ name: n, tin: $("pStart").value, tout: $("pEnd").value });
  $("guestName").value = ""; render();
};

// ---------- draft (stored on this phone) ----------
const DKEY = "qaem_draft_v1";
$("saveDraft").onclick = () => {
  const draft = { state, form: ["pName", "pUnit", "pDate", "pStart", "pEnd"].map((id) => $(id).value) };
  try { localStorage.setItem(DKEY, JSON.stringify(draft)); log("draft saved: OK"); toast("💾 ذخیره شد"); }
  catch (e) { log("draft save FAILED: " + e); toast("ذخیره نشد"); }
};
function restoreDraft() { try {
  const d = JSON.parse(localStorage.getItem(DKEY) || "null");
  if (d) { state = d.state; ["pName", "pUnit", "pDate", "pStart", "pEnd"].forEach((id, i) => $(id).value = d.form[i]);
    $("pCircle").value = state.circle; [...$("pType").children].forEach((b) => b.classList.toggle("on", b.dataset.v === state.type));
    log("draft restored from phone storage"); }
} catch (e) { log("draft read: " + e); }
render(); }

function toast(m) { if (W && W.showAlert) { try { W.showAlert(m); return; } catch (e) {} } alert(m); }

// ---------- output rows ----------
function rowsForOutput() {
  const rank = { pres: 0, leave: 1, abs: 2 };
  return MEMBERS.filter(([, c]) => state.circle < 0 || c === state.circle)
    .map(([n, c, kind]) => ({ n, c, kind, ...(state.people[n] || { st: state.type === "m" ? "abs" : "" }) }))
    .filter((r) => state.type === "m" ? !!r.st : r.st === "pres")
    .sort((a, b) => a.c - b.c || rank[a.st] - rank[b.st]);
}
function csvText() {
  const lines = ["نام,حلقه,نوع,وضعیت,ورود,خروج,برنامه,واحد,تاریخ"];
  const meta = [$("pName").value, $("pUnit").value, $("pDate").value];
  rowsForOutput().forEach((r) => lines.push([r.n, CIRCLES[r.c], r.kind, STATUS[r.st],
    r.st === "pres" ? (r.tin || $("pStart").value) : "", r.st === "pres" ? (r.tout || $("pEnd").value) : "", ...meta].join(",")));
  state.guests.forEach((g) => lines.push([g.name, "", "مهمان", "حاضر", g.tin, g.tout, ...meta].join(",")));
  return lines.join("\n");
}

// ---------- image: A4 at 300 dpi on the letterhead, same layout as the bot's image ----------
// Sizes below are in A4 "CSS px" (1240 x 1754) and multiplied by S when drawn.
const S = 2, PW = 1240 * S, PH = 1754 * S, MM = 1240 / 210;
const BOX = { top: Math.round(52 * MM) * S, bottom: Math.round(42 * MM) * S, side: Math.round(14 * MM) * S };
const DEPT = "واحد سرمایه انسانی", TEAL = "#1f6f78", INK = "#1d2b2f";
const F = (px, bold) => (bold ? "700 " : "") + px * S + 'px "BN","B Nazanin",Tahoma,sans-serif';
let LH = null, assetsTried = false;

async function loadAssets() {
  if (assetsTried) return; assetsTried = true;
  try {
    const f1 = new FontFace("BN", "url(BNazanin.ttf)"), f2 = new FontFace("BN", "url(BNazaninBold.ttf)", { weight: "700" });
    await Promise.all([f1.load(), f2.load()]); document.fonts.add(f1); document.fonts.add(f2); log("font B Nazanin: OK");
  } catch (e) { log("font FAILED: " + e); }
  try {
    const url = URL.createObjectURL(new Blob([await decryptFile("letterhead.enc", PASS)], { type: "image/jpeg" }));
    LH = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    log("letterhead: OK");
  } catch (e) { log("letterhead FAILED"); }
}
function toMin(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; }

async function makeImages() {
  await loadAssets();
  const mand = state.type === "m", start = $("pStart").value, end = $("pEnd").value, st0 = toMin(start);
  const cnt = { pres: 0, leave: 0, abs: 0, late: 0 }, groups = new Map();
  rowsForOutput().forEach((r) => {
    r.tin2 = r.st === "pres" ? (r.tin || start) : ""; r.tout2 = r.st === "pres" ? (r.tout || end) : "";
    r.late = r.st === "pres" && st0 !== null && toMin(r.tin2) > st0 + 10;
    cnt[r.st]++; if (r.late) cnt.late++;
    if (!groups.has(r.c)) groups.set(r.c, []); groups.get(r.c).push(r);
  });

  const L = BOX.side, R = PW - BOX.side, WD = R - L, BOTTOM = PH - BOX.bottom;
  const canvases = []; let x, y;
  function newPage() {
    const cv = document.createElement("canvas"); cv.width = PW; cv.height = PH; canvases.push(cv);
    x = cv.getContext("2d"); x.direction = "rtl"; x.textBaseline = "middle";
    x.fillStyle = "#fff"; x.fillRect(0, 0, PW, PH);
    if (LH) x.drawImage(LH, 0, 0, PW, PH);
    y = BOX.top;
  }
  function text(t, px, cy, font, color, align) { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(t, px, cy); }
  function rrect(x0, y0, w, h, r, fill, stroke, lw) {
    x.beginPath(); x.roundRect(x0, y0, w, h, r);
    if (fill) { x.fillStyle = fill; x.fill(); }
    if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || S; x.stroke(); }
  }
  newPage();

  // header (the letterhead already carries the organisation name)
  text(DEPT, PW / 2, y + 16 * S, F(26), "#555", "center"); y += 36 * S;
  text($("pName").value, PW / 2, y + 26 * S, F(44, true), INK, "center"); y += 60 * S;

  // info box
  const spans = [["واحد: ", $("pUnit").value], ["تاریخ: ", fa($("pDate").value)], ["ساعت: ", fa(start) + " تا " + fa(end)],
    ["نوع: ", mand ? "اجباری" : "اختیاری"], ["حلقه مخاطب: ", state.circle < 0 ? "همه حلقه‌ها" : CIRCLES[state.circle]]];
  const GAP = 28 * S;
  const sw = spans.map(([a, b]) => { x.font = F(27, true); const wa = x.measureText(a).width; x.font = F(27); return [wa, x.measureText(b).width]; });
  const lines = [[]]; let lw = 0;
  spans.forEach((sp, i) => { const w = sw[i][0] + sw[i][1]; if (lines[lines.length - 1].length && lw + GAP + w > WD - 40 * S) { lines.push([]); lw = 0; }
    lines[lines.length - 1].push(i); lw += (lw ? GAP : 0) + w; });
  const LH_INFO = 40 * S, boxH = lines.length * LH_INFO + 16 * S;
  rrect(L, y, WD, boxH, 12 * S, "#f3f8f9", TEAL, 2 * S);
  lines.forEach((ln, li) => {
    const tot = ln.reduce((s, i) => s + sw[i][0] + sw[i][1], 0) + GAP * (ln.length - 1);
    let cur = PW / 2 + tot / 2; const cy = y + 8 * S + LH_INFO * li + LH_INFO / 2;
    ln.forEach((i) => { text(spans[i][0], cur, cy, F(27, true), TEAL, "right"); cur -= sw[i][0];
      text(spans[i][1], cur, cy, F(27), INK, "right"); cur -= sw[i][1] + GAP; });
  });
  y += boxH + 14 * S;

  // badges
  const badges = [["حاضر", cnt.pres, "#e2f0d9", "#007832"]];
  if (cnt.late) badges.push(["تأخیر", cnt.late, "#fbe5d6", "#c85f00"]);
  if (mand) badges.push(["مرخصی", cnt.leave, "#fff2cc", "#966e00"], ["غایب", cnt.abs, "#f8d7da", "#be1e2d"]);
  badges.push(["مهمان", state.guests.length, "#ddebf7", "#2850a0"]);
  x.font = F(28, true);
  const bw = badges.map(([t, n]) => x.measureText(t + ": " + fa(n)).width + 44 * S), BG = 14 * S, BH = 46 * S;
  let bx = PW / 2 + (bw.reduce((a, b) => a + b, 0) + BG * (badges.length - 1)) / 2;
  badges.forEach(([t, n, bg, fg], i) => { rrect(bx - bw[i], y, bw[i], BH, 10 * S, bg, fg, 2 * S);
    text(t + ": " + fa(n), bx - bw[i] / 2, y + BH / 2 + S, F(28, true), fg, "center"); bx -= bw[i] + BG; });
  y += BH + 20 * S;

  // tables, continued on the next page with the header repeated
  const TH = 44 * S, HH = 38 * S, RH = 42 * S;
  function table(title, cols, rows) {   // cols: [[header, width fraction|null]], rows: [{cells, cls}]
    const fixed = cols.reduce((s, c) => s + (c[1] || 0), 0), widths = cols.map((c) => (c[1] || 1 - fixed) * WD);
    function head(cont) {
      if (y + TH + HH + RH > BOTTOM) newPage();
      rrect(L, y, WD, TH, [8 * S, 8 * S, 0, 0], TEAL);
      text(title + (cont ? " (ادامه)" : ""), R - 14 * S, y + TH / 2 + S, F(30, true), "#fff", "right"); y += TH;
      let cx = R;
      cols.forEach(([h], i) => { x.fillStyle = "#d9ecee"; x.fillRect(cx - widths[i], y, widths[i], HH);
        x.strokeStyle = "#9cc3c7"; x.lineWidth = S; x.strokeRect(cx - widths[i], y, widths[i], HH);
        text(h, cx - widths[i] / 2, y + HH / 2 + S, F(24, true), INK, "center"); cx -= widths[i]; });
      y += HH;
    }
    head(false);
    rows.forEach((r) => {
      if (y + RH > BOTTOM) { newPage(); head(true); }
      let cx = R;
      r.cells.forEach((c, i) => {
        x.fillStyle = r.bg || "#fff"; x.fillRect(cx - widths[i], y, widths[i], RH);
        x.strokeStyle = "#c5d9db"; x.lineWidth = S; x.strokeRect(cx - widths[i], y, widths[i], RH);
        const name = i === 1;
        text(c.t, name ? cx - 10 * S : cx - widths[i] / 2, y + RH / 2 + S, F(27, name || !!c.bold), c.color || r.color || INK, name ? "right" : "center");
        cx -= widths[i];
      });
      y += RH;
    });
    y += 16 * S;
  }
  const ST = { pres: ["حاضر", "#007832"], leave: ["مرخصی", "#966e00"], abs: ["غایب", "#be1e2d"] }, rank = { pres: 0, leave: 1, abs: 2 };
  [...groups.keys()].sort((a, b) => a - b).forEach((c) => {
    const items = groups.get(c).sort((a, b) => rank[a.st] - rank[b.st] || (a.kind !== "رسمی") - (b.kind !== "رسمی"));
    table(CIRCLES[c], [["ردیف", 0.07], ["نام و نام خانوادگی", null], ["نوع عضویت", 0.13], ["وضعیت", 0.11], ["ورود", 0.11], ["خروج", 0.11]],
      items.map((r, i) => ({
        bg: r.st === "leave" ? "#fffaf0" : r.st === "abs" ? "#fdf1f2" : "#fff", color: r.st === "abs" ? "#8a1520" : null,
        cells: [{ t: fa(i + 1) }, { t: r.n }, { t: r.kind }, { t: ST[r.st][0], color: ST[r.st][1], bold: true },
          { t: fa(r.tin2), color: r.late ? "#c85f00" : null, bold: r.late }, { t: fa(r.tout2) }],
      })));
  });
  if (state.guests.length) {
    table("مهمانان", [["ردیف", 0.07], ["نام و نام خانوادگی", null], ["ورود", 0.14], ["خروج", 0.14]],
      state.guests.map((g, i) => ({ cells: [{ t: fa(i + 1) }, { t: g.name }, { t: fa(g.tin) }, { t: fa(g.tout) }] })));
  }
  if (y + 30 * S > BOTTOM) newPage();
  text("ثبت‌شده در مینی‌اپ بله", L, y + 10 * S, F(20), "#777", "left");

  const n = canvases.length, out = [];
  for (let i = 0; i < n; i++) {
    x = canvases[i].getContext("2d"); x.direction = "rtl"; x.textBaseline = "middle";
    if (n > 1) text("صفحه " + fa(i + 1) + " از " + fa(n), L, PH - Math.max(10, BOX.bottom / S - 34) * S, F(20), "#777", "left");
    out.push(await new Promise((res) => canvases[i].toBlob(res, "image/jpeg", 0.9)));
  }
  return out;
}

// ---------- 6) hand the data to the phone's own browser, where saving files works ----------
// The data travels in the URL "#" part, which browsers never send to the web server.
const FORM_IDS = ["pName", "pUnit", "pDate", "pStart", "pEnd"];
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  bytes.forEach((b) => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
$("tBrowser").onclick = () => {
  const payload = b64urlEncode(JSON.stringify({ state, form: FORM_IDS.map((id) => $(id).value), k: PASS }));
  const url = location.href.split("#")[0].split("?")[0] + "#d=" + payload;
  log("6 open in browser: " + url.length + " chars");
  try {
    if (W && W.openLink) W.openLink(url, { try_instant_view: false }); else window.open(url, "_blank");
    log("6 openLink: called");
  } catch (e) { log("6 openLink FAILED: " + e); }
};
function handleHash(d) {        // opened from button 6, in the phone browser
  try {
    state = d.state; FORM_IDS.forEach((id, i) => $(id).value = d.form[i]);
    $("pCircle").value = state.circle;

    $("final").click();
  } catch (e) { log("6 data decode FAILED: " + e); }
}

// ---------- password + decryption (see src/miniapp_encrypt.py for the file format) ----------
async function decryptFile(url, pw) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + ": " + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  const salt = buf.slice(0, 16), iv = buf.slice(16, 32), ct = buf.slice(32, buf.length - 32), tag = buf.slice(buf.length - 32);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, 512));
  const mk = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const signed = new Uint8Array(16 + ct.length); signed.set(iv); signed.set(ct, 16);
  if (!(await crypto.subtle.verify("HMAC", mk, tag, signed))) throw new Error("BADPW");
  const ek = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, ek, ct));
}
const PWKEY = "qaem_pw_v1";
async function unlock(pw) {
  const data = JSON.parse(new TextDecoder().decode(await decryptFile("members.enc", pw)));
  PASS = pw; CIRCLES = data.circles; MEMBERS = data.members;
  try { localStorage.setItem(PWKEY, pw); } catch (e) {}
  fillLists(data.units);
  $("lock").classList.add("hidden");
  log("members: " + MEMBERS.length + " (decrypted OK)");
}
async function boot() {
  let hashData = null;
  if (location.hash.startsWith("#d=")) {
    try { hashData = JSON.parse(b64urlDecode(location.hash.slice(3))); } catch (e) { log("6 data decode FAILED: " + e); }
    history.replaceState(null, "", location.pathname);       // drop the data from the address bar
  }
  let pw = hashData && hashData.k;
  if (!pw) { try { pw = localStorage.getItem(PWKEY) || ""; } catch (e) { pw = ""; } }
  const go = async (p) => {
    await unlock(p);
    if (hashData) handleHash(hashData); else restoreDraft();
  };
  if (pw) { try { await go(pw); return; } catch (e) { log("saved password: " + e.message); } }
  $("lock").classList.remove("hidden");
  $("lockBtn").onclick = async () => {
    $("lockErr").textContent = "در حال بررسی…";
    try { await go($("lockPw").value.trim()); }
    catch (e) { $("lockErr").textContent = e.message === "BADPW" ? "رمز اشتباه است" : "خطا: " + e.message; }
  };
  $("lockPw").onkeydown = (e) => { if (e.key === "Enter") $("lockBtn").click(); };
}
boot();
})();
